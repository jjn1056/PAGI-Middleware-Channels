<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAGI-Middleware-Channels Chat</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="login-container">
            <h1>PAGI-Middleware-Channels Chat</h1>
            <p class="subtitle">Cross-Process Messaging Demo</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your name" maxlength="20" required>
                </div>
                <div class="form-group">
                    <label for="room">Room</label>
                    <input type="text" id="room" value="general" maxlength="20">
                </div>
                <button type="submit" class="btn-primary">Join Chat</button>
            </form>
            <div class="info">
                <p>Run with <code>--workers 4</code> to see cross-process messaging!</p>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen hidden">
        <div class="chat-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>PAGI-Middleware-Channels</h2>
                </div>
                <div id="connection-status" class="status disconnected">
                    <span class="status-dot"></span>
                    <span>Connecting...</span>
                </div>
                <div class="room-info">
                    <span class="room-label">Room:</span>
                    <span id="current-room">#general</span>
                </div>
                <div class="users-section">
                    <h3>Online Users <span id="user-count" class="badge">0</span></h3>
                    <ul id="users-list"></ul>
                </div>
            </aside>

            <!-- Main Chat -->
            <main class="chat-main">
                <div id="messages" class="messages"></div>
                <form id="message-form" class="message-form">
                    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" class="btn-primary">Send</button>
                </form>
            </main>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
