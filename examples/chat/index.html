<!DOCTYPE html>
<html>
<head>
    <title>PAGI-Channels Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        #messages div { margin: 5px 0; }
        .system { color: #888; font-style: italic; }
        .join { color: green; }
        .leave { color: red; }
        input[type="text"] { width: 70%; padding: 8px; }
        button { padding: 8px 16px; }
        #status { margin-bottom: 10px; padding: 5px; }
        .connected { background: #d4edda; }
        .disconnected { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>PAGI-Channels Chat</h1>

    <div id="setup">
        <label>Username: <input type="text" id="username" value="user1"></label><br><br>
        <label>Room: <input type="text" id="room" value="general"></label><br><br>
        <button onclick="connect()">Connect</button>
    </div>

    <div id="chat" style="display:none">
        <div id="status" class="disconnected">Disconnected</div>
        <div id="messages"></div>
        <input type="text" id="input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()">
        <button onclick="send()">Send</button>
    </div>

    <script>
        let ws;

        function connect() {
            const username = document.getElementById('username').value || 'anonymous';
            const room = document.getElementById('room').value || 'general';

            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat').style.display = 'block';

            const url = `ws://${location.hostname}:8000/chat/${room}?user=${username}`;
            ws = new WebSocket(url);

            ws.onopen = () => {
                document.getElementById('status').textContent = `Connected as ${username} in #${room}`;
                document.getElementById('status').className = 'connected';
                addMessage(`Connected to room: ${room}`, 'system');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'chat.message') {
                    addMessage(`${data.user}: ${data.text}`);
                } else if (data.type === 'user_joined') {
                    addMessage(`${data.user} joined`, 'system join');
                } else if (data.type === 'user_left') {
                    addMessage(`${data.user} left`, 'system leave');
                }
            };

            ws.onclose = () => {
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('status').className = 'disconnected';
                addMessage('Disconnected', 'system');
            };
        }

        function send() {
            const input = document.getElementById('input');
            if (input.value && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(input.value);
                addMessage(`You: ${input.value}`);
                input.value = '';
            }
        }

        function addMessage(text, className = '') {
            const div = document.createElement('div');
            div.textContent = text;
            if (className) div.className = className;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = 999999;
        }
    </script>
</body>
</html>
